name: Build GBA ROM

on:
  push:
    branches:
      - release/v0.2.11
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install host test dependencies
        run: python -m pip install Pillow==12.3.0
      - name: Run host correctness suite (no performance measurements)
        run: bash tests/run_host_tests.sh --correctness-only
  build:
    needs: host-tests
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:20260610
    steps:
      - name: Check out vocab trainer
        uses: actions/checkout@v4
      - name: Check out pinned Butano
        uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Build complete ROM
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - name: Verify ROM exists
        run: test -s vocab.gba
      - name: Upload complete ROM
        uses: actions/upload-artifact@v4
        with:
          name: gba-vocab-trainer-v0.2.11
          path: vocab.gba
          if-no-files-found: error
