name: V1.6 dictionary builder verification
on:
  push:
    branches: [feature/v1.6-dictionary]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==12.3.0
      - run: bash tests/run_host_tests.sh --correctness-only
  rom:
    runs-on: ubuntu-24.04
    container: devkitpro/devkitarm:20260610
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: GValiente/butano
          ref: 77dcbcb3d8783596a9f333c64eedbccec77b05dc
          path: _butano
      - name: Build template from this source revision
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITARM: /opt/devkitpro/devkitARM
        run: make -j2 LIBBUTANO="$GITHUB_WORKSPACE/_butano/butano"
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-template
          path: |
            gbavocab.gba
            gbavocab.elf
          if-no-files-found: error
  package:
    needs: rom
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: dictionary-template
      - run: python -m pip install PyInstaller==6.16.0 Pillow==12.3.0
      - run: python tests/test_dictionary_builder.py
      - run: python tests/test_builder_app.py
      - name: Package Windows PE and test actual executable
        if: runner.os == 'Windows'
        run: |
          python tests/test_builder_gui.py --template gbavocab.gba --out builder-dist/verification
          python builder/package.py
      - name: Package Linux executable and test actual executable
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a python tests/test_builder_gui.py --template gbavocab.gba --out builder-dist/verification
          xvfb-run -a python builder/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: dictionary-builder-${{ runner.os }}
          path: |
            builder-dist/gbavocab-builder-*.zip
            builder-dist/verification/*.json
            builder-dist/verification/*.png
            builder-dist/verification/gbavocab.gba
          if-no-files-found: error
